name: Bug report
description: Something renders wrong or the API misbehaves.
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Request URL
      description: The path and query you used, e.g. /month.png?style=sky&view=year. Remove anything private.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: Screenshots help. The X-Wallpaper-* response headers and the label=1 caption are useful too.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version (if relevant)
